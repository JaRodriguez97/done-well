<form class="dw-card task-form" (ngSubmit)="onSubmit()" novalidate>
  <div class="task-form__row">
    <ion-input
      class="task-form__input"
      type="text"
      [formControl]="titleControl"
      placeholder="¿Qué necesitas hacer hoy?"
      aria-label="Título de la nueva tarea"
      maxlength="120"
      (ionInput)="clearValidationError()"
    ></ion-input>

    <ion-button
      type="submit"
      class="btn-primary task-form__submit"
      [disabled]="disabled"
      aria-label="Agregar tarea"
    >
      <ion-icon
        slot="start"
        name="add-circle-outline"
        aria-hidden="true"
      ></ion-icon>
      Agregar
    </ion-button>
  </div>

  @if (validationError) {
    <div class="dw-error-box" role="alert">
      <ion-icon name="alert-circle-outline" aria-hidden="true"></ion-icon>
      <span>{{ validationError }}</span>
    </div>
  }
</form>
